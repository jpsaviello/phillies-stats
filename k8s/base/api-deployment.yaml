apiVersion: apps/v1
kind: Deployment
metadata:
  name: phillies-stats-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phillies-stats-api
  template:
    metadata:
      labels:
        app: phillies-stats-api
    spec:
      containers:
        - name: phillies-stats-api
          image: phillies-stats-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # Feature flag for the All-Star banner. Defaults to on; set to
            # "false" to hide it, then `kubectl rollout restart deploy/phillies-stats-api`.
            - name: SHOW_ALLSTAR_BANNER
              value: "false"
            - name: ODDS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phillies-stats-odds
                  key: ODDS_API_KEY
                  # Pod starts without the secret; /api/odds returns 503 and
                  # the client fails soft (odds just don't render).
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phillies-stats-anthropic
                  key: ANTHROPIC_API_KEY
                  # Pod starts without the secret; /api/chat returns 503 and
                  # the widget shows a friendly not-configured message.
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: phillies-stats-db
                  key: DATABASE_URL
                  # Pod starts without the secret; /api/signup and /api/login
                  # return 503 and /api/me falls soft to {"user": null}, so the
                  # header just shows "Sign In" and nothing else breaks.
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
