apiVersion: apps/v1
kind: Deployment
metadata:
  name: phillies-stats-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phillies-stats-api
  template:
    metadata:
      labels:
        app: phillies-stats-api
    spec:
      containers:
        - name: phillies-stats-api
          image: phillies-stats-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # Feature flag for the All-Star banner. Defaults to on; set to
            # "false" to hide it, then `kubectl rollout restart deploy/phillies-stats-api`.
            - name: SHOW_ALLSTAR_BANNER
              value: "false"
            - name: ODDS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phillies-stats-odds
                  key: ODDS_API_KEY
                  # Pod starts without the secret; /api/odds returns 503 and
                  # the client fails soft (odds just don't render).
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phillies-stats-anthropic
                  key: ANTHROPIC_API_KEY
                  # Pod starts without the secret; /api/chat returns 503 and
                  # the widget shows a friendly not-configured message.
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: phillies-stats-db
                  key: DATABASE_URL
                  # Pod starts without the secret; /api/signup and /api/login
                  # return 503 and /api/me falls soft to {"user": null}, so the
                  # header just shows "Sign In" and nothing else breaks.
                  optional: true
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phillies-stats-sendgrid
                  key: SENDGRID_API_KEY
                  # Pod starts without the secret; sendEmail() returns
                  # {success: false, error: 'email not configured'}.
                  optional: true
            # Only Vercel Cron actually calls /api/notifications/daily (see
            # vercel.json). Kept here for parity so the route can be exercised
            # against this backend by hand; without it the route answers 503.
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: phillies-stats-sendgrid
                  key: CRON_SECRET
                  optional: true
            # Canonical origin for the links inside the email and for reading
            # briefing.json / on-this-day.json. Falls back to the request's own
            # origin when unset.
            - name: SITE_ORIGIN
              value: "http://phillies-stats.com"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
